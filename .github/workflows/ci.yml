name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax + tests
        run: ./tests/run.sh
      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./bin
          additional_files: installer/install.sh
