name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax + tests
        run: ./tests/run.sh
      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./bin
          additional_files: 'init.zsh plugins/polish-ai/polish-ai.plugin.zsh plugins/polish-mux/polish-mux.plugin.zsh plugins/polish-tokens/polish-tokens.plugin.zsh tests/run.sh tests/test-tokens.sh installer/install.sh'
          severity: warning
