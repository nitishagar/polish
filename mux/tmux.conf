# polish mux/tmux.conf — tmux defaults for the polish shell.
# Use: symlink to ~/.tmux.conf (installer-managed) or run once per server:
#   tmux source-file /path/to/polish/mux/tmux.conf
# Reload from inside tmux: prefix + r (bound below).
#
# KEYBINDS (pane switching is prefix-free; matches zellij/wezterm Alt-hjkl):
#   Alt-h / Alt-j / Alt-k / Alt-l   select pane left/down/up/right (no prefix)
#   Alt-Shift-H/J/K/L               resize active pane 5 cells (no prefix)
#   Alt-o                           cycle to next pane (no prefix)
#   prefix + | / prefix + -         split window horizontally / vertically
#   prefix + s                      session tree picker (choose-tree)
#   prefix + r                      reload this config file
# Shell-side session pickers/aliases live in plugins/polish-mux/ (ta/tl/tn/mp).

# --- terminal / color ---
# 256-color baseline plus truecolor passthrough for editors and prompts.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# --- mouse + responsiveness ---
set -g mouse on
# Low escape-time so Alt-hjkl registers instantly (vim users: keep >= 10).
set -sg escape-time 10
set -g history-limit 50000

# --- prefix-free Alt-hjkl pane switching ---
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
# Prefix-free resize with Alt-Shift (some terminals send different escape
# codes for these; verify with `cat -v` and adjust if one fails to fire).
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5
bind -n M-o select-pane -t :.+

# --- prefixed helpers ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind s choose-tree -s -Z
# Reload prefers ~/.tmux.conf when it exists (symlink installs); per-server
# source-file installs get a hint instead of a loud red error.
bind r if-shell '[ -f ~/.tmux.conf ]' 'source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"' 'display-message "no ~/.tmux.conf (config was sourced per-server)"'

# --- session persistence notes ---
# tmux alone keeps sessions alive across shell exits but NOT across reboots or
# a tmux-server kill. For reboot-proof sessions, use TPM + resurrect/continuum:
#   set -g @plugin 'tmux-plugins/tpm'
#   set -g @plugin 'tmux-plugins/tmux-resurrect'
#   set -g @plugin 'tmux-plugins/tmux-continuum'
#   set -g @continuum-restore 'on'      # auto-restore on server start
#   set -g @resurrect-strategy-nvim 'session'
#   run '~/.tmux/plugins/tpm/tpm'
# Manual fallback: name sessions (`tn work`), list with `tl`, reattach with
# `ta`; polish-mux autostart (POLISH_TMUX_AUTOSTART=1) reattaches on login.
